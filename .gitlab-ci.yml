# ============================================================
# Folio — GitLab CI/CD Pipeline
#
# 구조:
#   test  → EC2 Runner (shell executor)
#   deploy → SSH로 EC2 접속 → 직접 빌드/배포
#
# 브랜치별 실행 범위:
#   feature/* (MR): test
#   develop:        test
#   master:         test → deploy (자동)
#
# 필요한 GitLab CI Variables:
#   - SSH_PRIVATE_KEY       (File 타입, EC2 PEM 키)
#   - EC2_HOST              (EC2 IP 또는 도메인)
#   - EC2_USER              (ubuntu 또는 ec2-user)
#   - DOPPLER_TOKEN_PRD     (Doppler prd 서비스 토큰)
#
# 필요한 Doppler prd Secrets (Vault Transit — plan V):
#   - VAULT_TOKEN           (필수 — vault-init.sh 출력 토큰. 미설정 시 backend fail-fast)
#   ※ 나머지 vault 설정 (enabled/url/transit-key/cache-ttl) 은 시크릿 아니므로
#     application-{dev,prod}.yml 코드 default 에 hardcode. Doppler 등록 불필요.
#
# 운영 1회 절차 (Vault):
#   1) 본 CI 가 EC2 에 코드·docker-compose 배포 (vault 컨테이너 기동되지만 미초기화)
#   2) ssh ec2 → bash /opt/folio/S14P31F203/infra/scripts/vault-init.sh
#      → 출력된 VAULT_TOKEN 을 Doppler prd 에 등록
#      → /opt/folio/data/vault/.init.secrets 를 EC2 외부로 즉시 이동 (USB·운영자 노트북)
#   3) GitLab 에서 deploy job 재실행 → 정상 배포
#   재기동 시: bash infra/scripts/vault-unseal.sh --interactive (unseal key 3 개 입력)
# ============================================================

variables:
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}

stages:
  - test
  - release
  - deploy

# ────────────────────────────────────────────────────────────
# Test (단위 테스트 + 린트)
# ────────────────────────────────────────────────────────────

test-backend:
  stage: test
  before_script:
    - export PATH="/home/gitlab-runner/.local/bin:$PATH"
  script:
    - cd backend && chmod +x gradlew && ./gradlew wrapper && ./gradlew test
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH =~ /^(develop|master)$/

test-ai:
  stage: test
  before_script:
    - export PATH="/home/gitlab-runner/.local/bin:$PATH"
    - cd ai
    - pip3 install --upgrade pip
    - pip3 install -e ".[dev,llm,db]"
  script:
    - ruff check . || echo "[warn] ruff lint issues found, skipping for now"
    - pytest -x --tb=short
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH =~ /^(develop|master)$/

# ────────────────────────────────────────────────────────────
# Release (Tag 기반 자동 배포 — Windows .exe + electron-updater 피드)
#
# 트리거: SemVer 패턴 tag push (예: v0.4.1) → master HEAD에 tag 권장
# 산출물: Folio-${VERSION}-Setup.exe + .blockmap + latest.yml
#         → EC2의 /opt/folio/releases/win/ 에 SCP
#         → nginx가 정적 서빙 (electron-builder publish.url과 매칭)
#
# Wine Docker image 사용 — Linux Runner에서 Windows nsis 빌드.
# 코드 사이닝 인증서 미보유라 publisher 검증 없이 빌드.
#
# 사전 1회 작업:
#   1) EC2에서 sudo mkdir -p /opt/folio/releases/win && sudo chown -R $USER /opt/folio/releases
#   2) GitLab Settings → Repository → Protected Tags 에 v* 추가 (master에만 tag 허용)
# ────────────────────────────────────────────────────────────

build-electron-windows:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    # Runner는 shell executor (deploy-production과 동일). image: 디렉티브는 무시됨.
    # ssh/scp는 EC2 runner host에 이미 설치되어 있다(deploy-production이 사용 중).
    # Wine 빌드는 docker run으로 인라인 격리 — runner host에 Wine 설치 불필요.
    - export PATH="/home/gitlab-runner/.local/bin:$PATH"
    # SSH_PRIVATE_KEY가 빈 값이면 GitLab CI Variables가 Protected라 tag에서 노출 안 됨.
    # 명확한 에러로 즉시 fail — chmod 단계의 모호한 missing operand 회피.
    - |
      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "[FATAL] SSH_PRIVATE_KEY 변수가 비어있습니다." >&2
        echo "        GitLab → Settings → CI/CD → Variables 에서" >&2
        echo "        SSH_PRIVATE_KEY/EC2_HOST/EC2_USER 의 'Protect variable' 체크 해제 또는" >&2
        echo "        Settings → Repository → Protected tags 에 v* 추가가 필요합니다." >&2
        exit 1
      fi
    - chmod 400 $SSH_PRIVATE_KEY
    # 워크스페이스 권한은 preflight-cleanup job(stage: .pre)에서 이미 회수됨.
  script:
    - |
      set -Eeuo pipefail
      VERSION="${CI_COMMIT_TAG#v}"
      echo "[release] tag=${CI_COMMIT_TAG} version=${VERSION}"

      # Wine + Mono + Node + pnpm이 사전 설치된 공식 이미지로 격리 빌드.
      # Runner host에는 docker만 있으면 됨 (이미 deploy-production이 docker 사용 중).
      # workspace를 마운트하고 frontend 디렉토리에서 빌드 실행.
      #
      # --user 호스트 UID:GID — 컨테이너 안에서 root로 실행되어 호스트에 root 소유
      # 파일을 남기는 문제 차단. 다음 job이 워크스페이스 정리 시 Permission denied 회피.
      # HOME=/tmp — non-root 사용자라 컨테이너 내부에 home dir 없을 수 있음, npm/pnpm
      # cache 경로를 임시 디렉토리로.
      # 컨테이너 환경 사전 검증된 사실:
      #   - 이미지에 pnpm 9.4.0 + corepack 0.31.0 + Wine 사전 설치됨
      #   - non-root(--user) 실행 시 /usr/local/bin 쓰기 거부됨 → corepack enable 실패
      #   - COREPACK_HOME 을 user-writable 경로로 명시 → user-local 활성화 성공
      #   - corepack prepare --activate 후에도 which pnpm은 여전히 9.4 system 경로 →
      #     반드시 'corepack pnpm ...' 으로 호출해야 prepare된 10.33.0이 사용됨
      #   - Wine은 보안상 world-writable($HOME=/tmp 같은 sticky-bit dir) 거부 →
      #     WINEPREFIX를 user 소유 디렉토리(workspace 마운트는 호스트 gitlab-runner uid 소유)
      #     로 명시. HOME=/tmp는 npm/pnpm/corepack에는 무해하므로 건드리지 않는다.
      RUNNER_UID=$(id -u)
      RUNNER_GID=$(id -g)
      # Vite는 빌드 시점의 process.env.VITE_*를 코드에 정적으로 박는다.
      # 누락되면 코드 default(localhost:8080)로 fallback → 데스크탑 앱이 본인 PC
      # 로컬호스트로 호출 → 연결 실패 + 백엔드 로그 0건. deploy-production의
      # web/landing 빌드와 동일한 prod URL을 컨테이너에 주입.
      docker run --rm \
        --user "${RUNNER_UID}:${RUNNER_GID}" \
        -v "$CI_PROJECT_DIR":/workspace \
        -w /workspace/frontend \
        -e HOME=/tmp \
        -e COREPACK_HOME=/tmp/.corepack \
        -e WINEPREFIX=/workspace/.wine \
        -e ELECTRON_CACHE=/workspace/.cache/electron \
        -e ELECTRON_BUILDER_CACHE=/workspace/.cache/electron-builder \
        -e VITE_API_URL=https://folio-editor.co.kr/api/v1 \
        -e VITE_POWERSYNC_URL=https://folio-editor.co.kr/sync \
        -e VITE_GOOGLE_CLIENT_ID=671225006090-dll3oqd60cd5cmrgr2uc27ssti12utiu.apps.googleusercontent.com \
        -e VITE_GOOGLE_DESKTOP_CLIENT_ID=671225006090-rtgpq7hlhomiql0qtqmgevbrbquhqqjk.apps.googleusercontent.com \
        electronuserland/builder:wine \
        bash -c "
          set -Eeuo pipefail
          # pnpm 10.33.0 user-local 활성화 (system path 안 건드림)
          corepack prepare pnpm@10.33.0 --activate

          # tag가 source of truth — package.json version 강제 sync (commit-back 안 함)
          sed -i 's/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/' package.json
          grep '\"version\"' package.json

          # corepack 으로 호출해야 prepare된 pnpm 10.33.0이 사용됨
          corepack pnpm install --frozen-lockfile
          corepack pnpm build:win
        "

      # 산출물 검증 — 3개 파일 모두 존재해야 함
      cd "$CI_PROJECT_DIR/frontend/release"
      EXE="Folio-${VERSION}-Setup.exe"
      BLOCKMAP="${EXE}.blockmap"
      YML="latest.yml"
      for f in "$EXE" "$BLOCKMAP" "$YML"; do
        [ -f "$f" ] || { echo "[FATAL] $f missing in release/"; ls -la; exit 1; }
      done
      echo "[release] artifacts:"
      ls -la "$EXE" "$BLOCKMAP" "$YML"

      # EC2 디렉토리 보장 + 권한 (idempotent — 매번 안전)
      ssh -o StrictHostKeyChecking=no -i $SSH_PRIVATE_KEY $EC2_USER@$EC2_HOST \
        "sudo mkdir -p /opt/folio/releases/win && sudo chown -R $EC2_USER:$EC2_USER /opt/folio/releases"

      # 업로드 순서: .exe + .blockmap 먼저, latest.yml 마지막
      # → electron-updater가 latest.yml을 본 시점에 .exe가 이미 존재해 sha512 검증 race 차단
      scp -o StrictHostKeyChecking=no -i $SSH_PRIVATE_KEY \
        "$EXE" "$BLOCKMAP" \
        $EC2_USER@$EC2_HOST:/opt/folio/releases/win/
      scp -o StrictHostKeyChecking=no -i $SSH_PRIVATE_KEY \
        "$YML" \
        $EC2_USER@$EC2_HOST:/opt/folio/releases/win/

      echo "[release] uploaded v${VERSION} to /opt/folio/releases/win/"
      echo "[release] verify: https://folio-editor.co.kr/releases/win/latest.yml"

# ────────────────────────────────────────────────────────────
# Deploy (SSH로 EC2 접속 → 직접 빌드 + Blue/Green 배포)
# ────────────────────────────────────────────────────────────

deploy-production:
  stage: deploy
  before_script:
    - export PATH="/home/gitlab-runner/.local/bin:$PATH"
    - chmod 400 $SSH_PRIVATE_KEY
  script:
    - |
      ssh -o StrictHostKeyChecking=no -i $SSH_PRIVATE_KEY $EC2_USER@$EC2_HOST << ENDSSH
        # pipefail: 파이프 중간에 실패해도 포착
        # Eeuo: 에러 시 중단, 미정의 변수 에러, ERR trap 상속
        set -Eeuo pipefail
        trap 'echo "[FATAL] Deploy failed at line \$LINENO (exit=\$?)" >&2' ERR

        echo "=== Folio Deploy ==="
        echo "Commit: $CI_COMMIT_SHORT_SHA"

        # 1. 소스 코드 최신화
        cd /opt/folio/S14P31F203
        git stash --include-untracked 2>/dev/null || true
        git fetch origin master
        git checkout master
        git pull origin master

        # 2. Doppler에서 시크릿 다운로드 (빌드 시 VITE_* 변수 필요)
        export DOPPLER_TOKEN=$DOPPLER_TOKEN_PRD
        cd /opt/folio/S14P31F203/infra/prod
        doppler secrets download --project folio --config prd --no-file --format env > .env
        echo "IMAGE_TAG=$CI_COMMIT_SHORT_SHA" >> .env
        set -a; source .env; set +a

        # 2.5. PLG + Metrics 데이터 디렉토리 보장 (Loki/Grafana/Prometheus 첫 기동 시 필요)
        sudo mkdir -p /opt/folio/data/loki /opt/folio/data/grafana /opt/folio/data/promtail-positions /opt/folio/data/prometheus
        sudo chown -R 10001:10001 /opt/folio/data/loki
        sudo chown -R 472:472 /opt/folio/data/grafana
        sudo chown -R 65534:65534 /opt/folio/data/prometheus  # Prometheus 컨테이너 user (nobody)

        # 2.6. Vault 데이터 디렉토리 (curious-wiggling-thacker plan V-1).
        # 최초 1회 운영자 SSH 접속 후 vault-init.sh 실행 → 토큰 Doppler 등록 필요.
        sudo mkdir -p /opt/folio/data/vault
        sudo chmod 700 /opt/folio/data/vault

        # 3. Docker 이미지 빌드
        cd /opt/folio/S14P31F203
        echo "[build] Building Docker images..."
        docker build -f infra/dockerfiles/Dockerfile.spring -t folio-backend:$CI_COMMIT_SHORT_SHA -t folio-backend:latest ./backend
        docker build -f infra/dockerfiles/Dockerfile.fastapi -t folio-ai:$CI_COMMIT_SHORT_SHA -t folio-ai:latest ./ai
        docker build -f infra/dockerfiles/Dockerfile.celery-worker -t folio-celery-worker:$CI_COMMIT_SHORT_SHA -t folio-celery-worker:latest ./ai
        # VITE_*는 모두 CI hardcode (도플러 미잔류 — 옵션 B). public OAuth Client ID는 빌드 결과물에 박혀도 무관.
        docker build -f infra/dockerfiles/Dockerfile.web \
          --build-arg VITE_API_URL=https://folio-editor.co.kr/api/v1 \
          --build-arg VITE_POWERSYNC_URL=https://folio-editor.co.kr/sync \
          --build-arg VITE_GOOGLE_CLIENT_ID=671225006090-dll3oqd60cd5cmrgr2uc27ssti12utiu.apps.googleusercontent.com \
          --build-arg VITE_GOOGLE_DESKTOP_CLIENT_ID=671225006090-rtgpq7hlhomiql0qtqmgevbrbquhqqjk.apps.googleusercontent.com \
          --build-arg VITE_LANDING_URL=https://folio-editor.co.kr/ \
          -t folio-web:$CI_COMMIT_SHORT_SHA -t folio-web:latest .
        # 랜딩 빌드: VITE_API_URL + VITE_EDITOR_URL 추가 (이전 누락 정정)
        docker build -f infra/dockerfiles/Dockerfile.landing \
          --build-arg VITE_API_URL=https://folio-editor.co.kr/api/v1 \
          --build-arg VITE_EDITOR_URL=https://folio-editor.co.kr/editor \
          --build-arg VITE_LANDING_URL=https://folio-editor.co.kr/ \
          -t folio-landing:$CI_COMMIT_SHORT_SHA -t folio-landing:latest .
        cd /opt/folio/S14P31F203/infra/prod

        # 3.1 upstream-active.conf 초기화 (없으면 기본값 생성)
        if [ ! -f nginx/upstream-active.conf ]; then
          cp nginx/upstream-blue.conf nginx/upstream-active.conf
        fi

        # 4. 현재 활성 색상 확인
        CURRENT=\$(cat /opt/folio/active-color 2>/dev/null || echo "blue")
        if [ "\$CURRENT" = "blue" ]; then NEXT="green"; else NEXT="blue"; fi
        echo "Switching: \$CURRENT → \$NEXT"

        # 5. Vault 컨테이너 사전 기동 + 상태 점검
        # backend (FOLIO_VAULT_ENABLED=true) 가 봉인된 Vault 에 대고 fail-fast 하지 않도록
        # 먼저 vault 만 띄우고 unsealed/active 상태인지 확인. 미초기화/봉인 시 deploy 중단.
        docker compose -f docker-compose.yml -f docker-compose.\${NEXT}.yml --env-file .env up -d vault < /dev/null
        sleep 3
        if ! bash /opt/folio/S14P31F203/infra/scripts/vault-status.sh folio-vault-prod; then
          echo ""
          echo "[deploy] ✗ Vault 가 준비되지 않음 — backend 기동 중단."
          echo "        최초 1회: bash /opt/folio/S14P31F203/infra/scripts/vault-init.sh"
          echo "        재기동 시: bash /opt/folio/S14P31F203/infra/scripts/vault-unseal.sh --interactive"
          echo "        그 후 GitLab 에서 deploy job 재실행."
          exit 2
        fi

        # 6. 새 색상 컨테이너 기동
        # < /dev/null: heredoc stdin 소비 방어 (docker compose의 잠재적 stdin attach 회피)
        docker compose -f docker-compose.yml -f docker-compose.\${NEXT}.yml --env-file .env up -d < /dev/null

        # 6. 헬스체크
        BACKEND_PORT=\$( [ "\$NEXT" = "blue" ] && echo 8081 || echo 8082 )
        AI_PORT=\$( [ "\$NEXT" = "blue" ] && echo 8091 || echo 8092 )
        WEB_PORT=\$( [ "\$NEXT" = "blue" ] && echo 3001 || echo 3002 )
        LANDING_PORT=\$( [ "\$NEXT" = "blue" ] && echo 3011 || echo 3012 )
        CELERY_CONTAINER="folio-celery-worker-\${NEXT}"

        echo "Waiting for health checks..."
        HEALTH_OK=true

        # Backend (Spring Boot) — 부팅 ~14초, 30회 × 2초 = 60초 여유 충분
        for i in \$(seq 1 30); do
          if curl -sf http://localhost:\${BACKEND_PORT}/actuator/health > /dev/null 2>&1; then
            echo "Backend healthy (attempt \$i)"
            break
          fi
          if [ \$i -eq 30 ]; then HEALTH_OK=false; echo "Backend health check failed!"; fi
          sleep 2
        done

        # AI (FastAPI)
        if [ "\$HEALTH_OK" = true ]; then
          for i in \$(seq 1 20); do
            if curl -sf http://localhost:\${AI_PORT}/v1/health > /dev/null 2>&1; then
              echo "AI healthy (attempt \$i)"
              break
            fi
            if [ \$i -eq 20 ]; then HEALTH_OK=false; echo "AI health check failed!"; fi
            sleep 2
          done
        fi

        # Celery worker (broker ping via docker exec)
        if [ "\$HEALTH_OK" = true ]; then
          for i in \$(seq 1 10); do
            if docker exec \${CELERY_CONTAINER} celery -A app.celery_app inspect ping -t 5 > /dev/null 2>&1; then
              echo "Celery worker healthy (attempt \$i)"
              break
            fi
            if [ \$i -eq 10 ]; then HEALTH_OK=false; echo "Celery worker health check failed!"; fi
            sleep 3
          done
        fi

        # Web (React SPA)
        if [ "\$HEALTH_OK" = true ]; then
          for i in \$(seq 1 15); do
            if curl -sf http://localhost:\${WEB_PORT}/healthz > /dev/null 2>&1; then
              echo "Web healthy (attempt \$i)"
              break
            fi
            if [ \$i -eq 15 ]; then HEALTH_OK=false; echo "Web health check failed!"; fi
            sleep 2
          done
        fi

        # Landing
        if [ "\$HEALTH_OK" = true ]; then
          for i in \$(seq 1 10); do
            if curl -sf http://localhost:\${LANDING_PORT}/healthz > /dev/null 2>&1; then
              echo "Landing healthy (attempt \$i)"
              break
            fi
            if [ \$i -eq 10 ]; then HEALTH_OK=false; echo "Landing health check failed!"; fi
            sleep 2
          done
        fi

        # 헬스체크 실패 시 새 컨테이너 정리 후 종료
        if [ "\$HEALTH_OK" = false ]; then
          echo "[rollback] Capturing failure logs before cleanup..."
          # 진단을 위한 로그 출력 (backend/ai 200줄, web/landing 50줄)
          for svc in backend ai celery-worker; do
            echo "=== folio-\${svc}-\${NEXT} logs (tail 200) ==="
            docker logs --tail 200 folio-\${svc}-\${NEXT} 2>&1 || echo "(container not found)"
          done
          for svc in web landing; do
            echo "=== folio-\${svc}-\${NEXT} logs (tail 50) ==="
            docker logs --tail 50 folio-\${svc}-\${NEXT} 2>&1 || echo "(container not found)"
          done
          echo "[rollback] Stopping failed \$NEXT containers..."
          docker compose -f docker-compose.yml -f docker-compose.\${NEXT}.yml --env-file .env \
            rm -sf spring-boot-\${NEXT} fastapi-\${NEXT} celery-worker-\${NEXT} react-web-\${NEXT} landing-\${NEXT} \
            < /dev/null \
            || echo "[rollback] Warning: failed to remove \${NEXT} containers"
          rm -f .env
          echo "[rollback] \$CURRENT still active. Deploy aborted."
          exit 1
        fi

        # 7. Nginx upstream 전환 + 재시작
        cp nginx/upstream-\${NEXT}.conf nginx/upstream-active.conf
        # docker compose exec (without -T)는 SSH heredoc의 나머지 stdin을 삼켜서
        # 이후 명령들이 silently skip되는 공식 버그 (docker/compose#7776, #10228).
        # → docker exec 직접 사용 + < /dev/null 로 이중 방어.
        docker exec folio-nginx nginx -s reload < /dev/null

        # 8. 원자성: 트래픽 전환 직후 즉시 상태 기록
        #    (stdin 소비 또는 다른 이유로 이후 명령이 실패해도 상태 파일 일관성 보장)
        echo "\$NEXT" > /opt/folio/active-color

        sleep 5

        # 9. 이전 색상 종료
        docker compose -f docker-compose.yml -f docker-compose.\${CURRENT}.yml --env-file .env \
          rm -sf spring-boot-\${CURRENT} fastapi-\${CURRENT} celery-worker-\${CURRENT} react-web-\${CURRENT} landing-\${CURRENT} \
          < /dev/null \
          || echo "[deploy] Warning: failed to stop \${CURRENT} containers"

        # 10. 정리
        rm -f .env
        docker image prune -f > /dev/null 2>&1 || true

        echo "=== Deploy Complete: \$NEXT ($CI_COMMIT_SHORT_SHA) ==="
      ENDSSH

      # Sentinel 체크: heredoc 내 stdin 이상 등으로 조기 종료 시 CI도 명시적 실패 처리
      # (위 heredoc의 마지막 echo가 실제로 출력되었는지 GitLab Runner 쪽에서 검증)
      echo "[CI] Verifying deploy completed the full sequence..."
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  environment:
    name: production
