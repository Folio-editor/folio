# ============================================================
# Folio — SSL 초기 발급용 HTTP-only Nginx 설정
#
# SSL 인증서가 아직 없을 때 사용. Certbot이 ACME challenge를
# 수행할 수 있도록 port 80만 열어둔다.
#
# 사용법:
#   1. 이 파일을 nginx.conf 대신 마운트
#   2. certbot으로 인증서 발급
#   3. 발급 완료 후 nginx.conf (풀 HTTPS)로 교체 + reload
# ============================================================
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 헬스체크
        location /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # 그 외는 503 (아직 서비스 준비 안 됨)
        location / {
            return 503 "Service starting - SSL provisioning in progress";
            add_header Content-Type text/plain;
        }
    }
}
