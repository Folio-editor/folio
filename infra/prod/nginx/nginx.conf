worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # JSON 구조화 로그 포맷 — Promtail/Loki에서 필드 단위 파싱 가능
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # upstream 정의 (active color에 따라 교체)
    include /etc/nginx/conf.d/upstream.conf;

    # ─── Prometheus stub_status — folio-net 내부 전용 (B-2) ───
    # nginx-exporter (172.x docker bridge) 만 scrape. 외부 노출 금지.
    server {
        listen 8888;
        server_name _;
        access_log off;
        location /nginx_status {
            stub_status;
            allow 172.16.0.0/12;
            deny all;
        }
    }

    # ─── HTTP → HTTPS 리다이렉트 ─────────────────────────────
    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 헬스체크 (내부용)
        location /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # 나머지 HTTPS로 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS ────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 인증서 (Let's Encrypt) — 도메인 직접 지정
        ssl_certificate /etc/letsencrypt/live/folio-editor.co.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/folio-editor.co.kr/privkey.pem;

        # SSL 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        # SAMEORIGIN: Grafana iframe 패널이 동일 도메인에서 동작해야 하므로 DENY 대신 사용
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─── 라우팅 ──────────────────────────────────────────

        # 데스크탑 앱 자동 업데이트 피드 (electron-updater generic provider)
        # - latest.yml: 짧은 TTL (새 릴리스 직후 클라이언트가 빠르게 인지)
        # - .exe / .blockmap: 파일명에 버전이 박혀있어 사실상 immutable
        # - autoindex off: 디렉터리 리스팅 차단 (의도된 파일만 다운로드 가능)
        location /releases/ {
            alias /usr/share/nginx/releases/;
            autoindex off;
            types {
                text/yaml yml;
                application/octet-stream exe;
                application/octet-stream blockmap;
            }
            add_header X-Content-Type-Options "nosniff" always;
            # 부모 add_header 는 nested location 에서 상속되지 않으므로 각각에 다시 명시.
            location ~* \.yml$ {
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cache-Control "public, max-age=300" always;
            }
            location ~* \.(exe|blockmap)$ {
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cache-Control "public, max-age=86400, immutable" always;
            }
        }

        # 웹 에디터 (React SPA, /editor 경로)
        # vite base='/editor/'로 빌드된 자산은 '/editor/assets/...' 경로로 요청됨.
        # 컨테이너 내부 nginx는 root='/usr/share/nginx/html'에 'assets/...'로 갖고 있으므로
        # '/editor/' prefix를 strip해서 '/assets/...'로 전달해야 한다.
        # → location과 proxy_pass 양쪽 모두 trailing slash 필수 (nginx 공식 문서: prefix replacement).
        #
        # /editor (trailing slash 없는 단독 진입) → /editor/로 301 redirect (query 보존).
        # nginx prefix matching상 length 8 > 1이라 '/' 매칭보다 우선 → 다른 location 충돌 없음.
        location = /editor {
            return 301 /editor/$is_args$args;
        }
        location /editor/ {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 랜딩 페이지 (/ 루트)
        location / {
            proxy_pass http://landing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check 엔드포인트 — access log 제외 (15초 간격 폴링으로 노이즈 발생)
        location = /api/actuator/health {
            access_log off;
            proxy_pass http://backend/api/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /api/v1/health {
            access_log off;
            proxy_pass http://backend/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── SSE 스트리밍 (agent chat / 검수) ───────────────────
        # consistency_check 같은 멀티 도구 시나리오는 도구 호출 사이 Claude thinking
        # idle 구간이 수십 초~수 분에 달한다. 일반 /api/ 블록의 60s read timeout 으로는
        # 중간에 끊겨 클라이언트가 "전송 실패: network error" 를 받는다.
        # 또한 SSE 는 proxy_buffering off + HTTP/1.1 keep-alive 가 필수.
        # 정규식 location(~)은 prefix location 보다 우선 매칭됨.
        location ~ ^/api/v1/agent/threads/[^/]+/messages/stream$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no always;

            # Spring SseEmitter timeout(10분)에 맞춤
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 백엔드 API
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # PowerSync WebSocket
        location /sync/ {
            proxy_pass http://powersync:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Grafana 대시보드 (로그/모니터링 UI)
        # - resolver + 변수: nginx 기동 시점에 grafana 컨테이너가 아직 없어도 크래시 안 함
        # - proxy_pass에 URI 생략: nginx는 변수가 포함되면 location prefix 치환을 비활성화
        #   하므로 URI를 명시하면 request_uri가 사라짐(/grafana/login → /grafana/로 납작화).
        #   URI를 생략하면 원본 request_uri가 그대로 upstream에 전달됨.
        #   (nginx 공식 trac #1067, #803 참조)
        location /grafana/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $grafana_upstream "grafana:3000";
            proxy_pass http://$grafana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Grafana Live (WebSocket) 지원
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
