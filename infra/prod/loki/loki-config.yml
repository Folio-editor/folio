# ============================================================
# Loki 3.x — 단일 인스턴스 (filesystem 저장, 7일 보관)
#
# 목적: Promtail에서 수집한 Docker 컨테이너 로그를 저장하고 Grafana에 제공.
# 제약: 단일 EC2 환경, 메모리 ~200MB 내외, 디스크 ~200MB (7일 예상).
# ============================================================

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2025-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  retention_period: 168h            # 7일 자동 삭제
  max_query_length: 721h
  max_query_parallelism: 2
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  max_entries_limit_per_query: 5000
  # 8KB 초과 로그 라인 서버에서 강제 거부 — 프롬프트/stack trace 유출 최종 방어선
  max_line_size: 8192

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
