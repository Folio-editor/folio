# ============================================================
# Folio — 프로덕션 공유 서비스
#
# Nginx, DB, Redis, MongoDB, PowerSync, Certbot 등
# 배포 시 교체되지 않는 고정 인프라 서비스.
#
# 사용법 (Blue/Green과 함께):
#   cd /opt/folio/infra/prod
#   docker compose -f docker-compose.yml -f docker-compose.blue.yml up -d
#
# 환경변수:
#   Doppler에서 .env 다운로드 후 --env-file로 주입
# ============================================================
services:
  # ─── Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:1.30-alpine
    container_name: folio-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream-active.conf:/etc/nginx/conf.d/upstream.conf:ro
      - /opt/folio/data/certbot/conf:/etc/letsencrypt:ro
      - /opt/folio/data/certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - folio-net

  # ─── Database ───────────────────────────────────────────────
  postgresql:
    image: pgvector/pgvector:pg17
    container_name: folio-postgresql-prod
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PS_REPL_PASSWORD: ${PS_REPL_PASSWORD}
    volumes:
      - /opt/folio/data/postgresql:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/powersync-init.sh:/docker-entrypoint-initdb.d/02-powersync.sh:ro
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=8
        -c max_wal_senders=8
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c max_connections=200
        -c wal_keep_size=1GB
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - folio-net

  # ─── Cache ──────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: folio-redis-prod
    command: >
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    volumes:
      - /opt/folio/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - folio-net

  # ─── MongoDB (PowerSync bucket storage) ─────────────────────
  mongo:
    image: mongo:8
    container_name: folio-mongo-prod
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    volumes:
      - /opt/folio/data/mongodb:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok }
         catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 30s
      start_period: 15s
      retries: 30
    restart: always
    networks:
      - folio-net

  # ─── PowerSync ──────────────────────────────────────────────
  powersync:
    image: journeyapps/powersync-service:latest
    container_name: folio-powersync-prod
    depends_on:
      postgresql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ../powersync/powersync-prod.yaml:/app/powersync.yaml:ro
      - ../powersync/sync-rules.yaml:/app/sync-rules.yaml:ro
    environment:
      PS_DATA_SOURCE_URI: postgresql://folio_repl:${PS_REPL_PASSWORD}@postgresql:5432/${DB_NAME}
      PS_MONGO_URI: mongodb://mongo:27017/powersync
      PS_JWT_K: ${PS_JWT_K}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/probes/liveness').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - folio-net

  # ─── SSL Auto-Renewal ──────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: folio-certbot
    volumes:
      - /opt/folio/data/certbot/conf:/etc/letsencrypt
      - /opt/folio/data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    restart: always
    networks:
      - folio-net

networks:
  folio-net:
    name: folio-net
    driver: bridge
