# ============================================================
# Folio — 프로덕션 공유 서비스
#
# Nginx, DB, Redis, MongoDB, PowerSync, Certbot 등
# 배포 시 교체되지 않는 고정 인프라 서비스.
#
# 사용법 (Blue/Green과 함께):
#   cd /opt/folio/infra/prod
#   docker compose -f docker-compose.yml -f docker-compose.blue.yml up -d
#
# 환경변수:
#   Doppler에서 .env 다운로드 후 --env-file로 주입
# ============================================================

# 로그 로테이션 공통 설정 (컨테이너당 최대 150MB: 50MB × 3파일)
# 디스크 풀로 서버가 다운되는 것을 물리적으로 차단한다.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ─── Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:1.30-alpine
    container_name: folio-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream-active.conf:/etc/nginx/conf.d/upstream.conf:ro
      - /opt/folio/data/certbot/conf:/etc/letsencrypt:ro
      - /opt/folio/data/certbot/www:/var/www/certbot:ro
      # 데스크탑 앱 자동 업데이트 피드 (electron-updater generic provider)
      # /opt/folio/releases/ 아래에 latest.yml + Folio-x.y.z-Setup.exe + .blockmap 을 배치.
      - /opt/folio/releases:/usr/share/nginx/releases:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  # ─── Database ───────────────────────────────────────────────
  postgresql:
    image: pgvector/pgvector:pg17
    container_name: folio-postgresql-prod
    environment:
      # `:?error` 패턴: 빈 값/미설정 시 compose가 즉시 실패 (cascade failure 차단)
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in Doppler}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in Doppler}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in Doppler}
      PS_REPL_PASSWORD: ${PS_REPL_PASSWORD:?PS_REPL_PASSWORD must be set in Doppler}
    volumes:
      - /opt/folio/data/postgresql:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/powersync-init.sh:/docker-entrypoint-initdb.d/02-powersync.sh:ro
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=8
        -c max_wal_senders=8
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c max_connections=200
        -c wal_keep_size=1GB
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  # ─── Cache ──────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: folio-redis-prod
    command: >
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in Doppler}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    volumes:
      - /opt/folio/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  # ─── MongoDB (PowerSync bucket storage) ─────────────────────
  mongo:
    image: mongo:8
    container_name: folio-mongo-prod
    # --quiet: 단일 노드 replica set 에서 불필요한 heartbeat/election 로그 억제
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1", "--quiet"]
    volumes:
      - /opt/folio/data/mongodb:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok }
         catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 30s
      start_period: 15s
      retries: 30
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  # ─── PowerSync ──────────────────────────────────────────────
  powersync:
    image: journeyapps/powersync-service:latest
    container_name: folio-powersync-prod
    depends_on:
      postgresql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ../powersync/powersync-prod.yaml:/app/powersync.yaml:ro
      - ../powersync/sync-rules.yaml:/app/sync-rules.yaml:ro
    environment:
      # PS_REPL_PASSWORD/DB_NAME는 위 postgresql에서 이미 :? validated → 안전
      PS_DATA_SOURCE_URI: postgresql://folio_repl:${PS_REPL_PASSWORD}@postgresql:5432/${DB_NAME}
      PS_MONGO_URI: mongodb://mongo:27017/powersync
      PS_JWT_K: ${PS_JWT_K}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/probes/liveness').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  # ─── SSL Auto-Renewal ──────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: folio-certbot
    volumes:
      - /opt/folio/data/certbot/conf:/etc/letsencrypt
      - /opt/folio/data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  # ─── Log Aggregation (PLG Stack) ───────────────────────────
  loki:
    image: grafana/loki:3.4
    container_name: folio-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - /opt/folio/data/loki:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  promtail:
    image: grafana/promtail:3.4
    container_name: folio-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/folio/data/promtail-positions:/tmp/positions
    depends_on:
      loki:
        condition: service_healthy
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  # ─── Metrics Stack (Prometheus + exporters) ────────────────
  # 모두 folio-net 내부 전용. 외부 포트 노출 없음. Grafana 가 데이터소스로 proxy.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: folio-prometheus
    user: "65534:65534"  # nobody — /opt/folio/data/prometheus 소유자와 일치
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/folio/data/prometheus:/prometheus
      # docker_sd_configs 가 컨테이너 SD 위해 필요 (read-only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    # exporters started 후 기동 — healthy 까진 기다리지 않음 (Prometheus 자체는 target down 도 graceful 처리)
    depends_on:
      - node-exporter
      - cadvisor
      - postgres-exporter
      - redis-exporter
      - mongodb-exporter
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: folio-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: folio-cadvisor
    privileged: true
    # cAdvisor 가 Docker 컨테이너를 인식하도록 옵션 명시
    #   --docker_only=true            : systemd cgroup 노이즈 제거, Docker 컨테이너만 노출
    #   --store_container_labels=false: 모든 라벨을 메트릭에 자동 부착하지 않음 (cardinality 폭발 방어)
    #   --whitelisted_container_labels: color/service 등 우리 라벨만 컨테이너 메트릭에 부착
    command:
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=color,service,environment"
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      # Docker 메타데이터 (컨테이너 이름, 라벨) 직접 접근 — name=folio-* 필터를 위해 필수
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  # ─── DB/Redis/MongoDB Exporters ─────────────────────────────
  # 각 exporter 는 대상 서비스가 healthy 된 후 기동 (초기 메트릭 수집 실패 방지).
  postgres-exporter:
    # PostgreSQL 17 호환을 위해 v0.17.1 사용. v0.15.0 은 PG17 에서
    # pg_stat_bgwriter 가 pg_stat_checkpointer 로 분리된 BREAKING CHANGE 를
    # 인식 못해 30초마다 "column checkpoints_timed does not exist" 에러 누적.
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: folio-postgres-exporter
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # 분리 환경변수 사용 — DB_PASSWORD 의 특수문자(@,:,/) URL 인코딩 회피
      DATA_SOURCE_URI: "postgresql:5432/${DB_NAME}?sslmode=disable"
      DATA_SOURCE_USER: ${DB_USERNAME}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: folio-redis-exporter
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  mongodb-exporter:
    image: percona/mongodb_exporter:0.41.2
    container_name: folio-mongodb-exporter
    depends_on:
      mongo:
        condition: service_healthy
    # 인증 미사용 (mongo 컨테이너는 --auth 미설정, MONGO_INITDB_ROOT_* 없음)
    command:
      - '--mongodb.uri=mongodb://mongo:27017/?replicaSet=rs0&directConnection=true'
      - '--collect-all'
      - '--compatible-mode'
    restart: always
    logging: *default-logging
    networks:
      - folio-net

  grafana:
    image: grafana/grafana:11.6.0
    container_name: folio-grafana
    environment:
      GF_SERVER_ROOT_URL: https://folio-editor.co.kr/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # 필수 — Doppler에 GRAFANA_ADMIN_PASSWORD 없으면 compose가 즉시 실패.
      # 빈 문자열로 주입되어 기본 admin/admin 로그인 허용되는 보안 사고 방지.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in Doppler}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_LOG_LEVEL: warn
    volumes:
      - /opt/folio/data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      # SERVE_FROM_SUB_PATH=true 이므로 내부 경로에도 /grafana/ 프리픽스 필수
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/grafana/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging
    networks:
      - folio-net

networks:
  folio-net:
    name: folio-net
    driver: bridge
