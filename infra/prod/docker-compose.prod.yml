# ============================================================
# 운영 배포 스택
#
# - 모든 시크릿은 .env (서버에 직접 관리, git 커밋 금지)
# - 백엔드 포함 전체 컨테이너화
# - PostgreSQL 포트는 외부 노출 안 함 (백엔드 컨테이너 내부 통신만)
#
# 사용법:
#   cd infra/prod
#   cp ../.env.prod.example .env  # 후 실값 입력
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# ============================================================
services:
  postgresql:
    image: postgres:16-alpine
    container_name: storyzip-postgresql-prod
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - storyzip-pgdata-prod:/var/lib/postgresql/data
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - storyzip-net

  redis:
    image: redis:7-alpine
    container_name: storyzip-redis-prod
    command: >
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
    volumes:
      - storyzip-redis-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - storyzip-net

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: storyzip-backend-prod
    image: storyzip-backend:${APP_VERSION:-latest}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always
    networks:
      - storyzip-net

volumes:
  storyzip-pgdata-prod:
  storyzip-redis-prod:

networks:
  storyzip-net:
    driver: bridge
