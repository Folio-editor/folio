# ============================================================
# Grafana 데이터소스 자동 프로비저닝 — Prometheus
# 컨테이너 시작 시 자동 등록됨, UI에서 편집 불가 (editable: false)
# ============================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      manageAlerts: true
