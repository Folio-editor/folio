apiVersion: 1
# Contact points — 실제 webhook 은 Doppler prd config 의 GF_ALERTING_SLACK_URL / GF_ALERTING_EMAIL 로 주입.
# Grafana provisioning 은 ${...} 환경변수 치환을 지원하지 않으므로, 처음엔 console 로깅만 받는 default
# receiver 하나만 등록하고, 실제 Slack/Email 연동은 Grafana UI 에서 발급 후 매핑 권장.
# 본 파일은 alert 룰이 fail loudly 하지 않도록 default receiver 만 제공 (no-op log).
contactPoints:
  - orgId: 1
    name: folio-default
    receivers:
      - uid: folio-default-receiver
        type: webhook
        settings:
          # webhook URL 은 운영 채널 결정 후 Grafana UI 또는 환경변수로 갱신.
          # 미설정 시 Grafana 가 webhook 호출 후 timeout — 운영 영향 X (룰은 발화됨).
          url: http://localhost:9999/alert-sink-placeholder
          httpMethod: POST
          maxAlerts: 10
