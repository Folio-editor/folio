apiVersion: 1
# Notification routing policies — severity 별 group/repeat 간격 분리.
policies:
  - orgId: 1
    receiver: folio-default
    group_by: [grafana_folder, alertname, severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: folio-default
        matchers: ['severity = critical']
        group_wait: 10s
        repeat_interval: 1h
      - receiver: folio-default
        matchers: ['severity = high']
        group_wait: 30s
        repeat_interval: 2h
      - receiver: folio-default
        matchers: ['severity = medium']
        group_wait: 1m
        repeat_interval: 6h
