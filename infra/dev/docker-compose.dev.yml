# ============================================================
# 개발용 인프라 (PostgreSQL + Redis + MongoDB + PowerSync)
#
# 백엔드/프론트엔드 애플리케이션은 IDE/로컬에서 직접 실행한다.
#
# 사용법:
#   cd infra/dev
#   doppler run -- docker compose -f docker-compose.dev.yml up -d
#
# DB 스키마 원본:
#   infra/db/schema.sql          — 최초 기동 시 자동 적용 (01-)
#   infra/db/powersync-init.sh   — replication role + publication (02-)
# ============================================================
services:
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: storyzip-postgresql-dev
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-storyzip}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storyzip_dev}
      POSTGRES_DB: ${DB_NAME:-storyzip}
    volumes:
      - storyzip-pgdata-dev:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/powersync-init.sh:/docker-entrypoint-initdb.d/02-powersync.sh:ro
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
        -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-storyzip}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: storyzip-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
        --appendonly yes
        ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - storyzip-redis-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: storyzip-mongo-dev
    # PowerSync는 change streams를 쓰므로 standalone이 아닌 replica set이 필요
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - storyzip-mongo-dev:/data/db
    healthcheck:
      # rs.status() 실패 시 자체 initiate — replica set 초기화를 healthcheck로 처리
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok }
         catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 30s
      start_period: 10s
      retries: 30
    restart: unless-stopped

  powersync:
    image: journeyapps/powersync-service:latest
    container_name: storyzip-powersync-dev
    depends_on:
      postgresql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "${PS_PORT:-8090}:8080"
    volumes:
      - ../powersync/powersync.yaml:/app/powersync.yaml:ro
      - ../powersync/sync-rules.yaml:/app/sync-rules.yaml:ro
    environment:
      PS_DATA_SOURCE_URI: postgresql://folio_repl:storyzip_repl_dev@postgresql:5432/${DB_NAME:-storyzip}
      PS_MONGO_URI: mongodb://mongo:27017/powersync
      PS_JWT_K: ${PS_JWT_K}
    healthcheck:
      # powersync 이미지에 wget/curl이 없어 node로 probe
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/probes/liveness').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    container_name: storyzip-vault-dev
    ports:
      - "${VAULT_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ../vault/config:/vault/config:ro
      - storyzip-vault-dev:/vault/data
    # docker-entrypoint.sh 가 'server' 인자를 보면 자동으로 -dev-listen-address=0.0.0.0:8200
    # 와 -config=/vault/config 를 prepend → 우리 vault.hcl 의 listener 와 충돌
    # (address already in use). entrypoint 를 우회하여 raw vault 바이너리 직접 실행.
    entrypoint: ["vault", "server", "-config=/vault/config/vault.hcl"]
    command: []
    healthcheck:
      # 봉인 상태(503)도 살아있는 것으로 간주 — 운영자가 unseal 해야 동작
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health?sealedcode=200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  storyzip-pgdata-dev:
  storyzip-redis-dev:
  storyzip-mongo-dev:
  storyzip-vault-dev:
