# ============================================================
# 개발용 인프라 (PostgreSQL + Redis)
#
# 백엔드/프론트엔드 애플리케이션은 IDE/로컬에서 직접 실행한다.
#
# 사용법:
#   cd infra/dev
#   cp .env.example .env
#   docker compose -f docker-compose.dev.yml --env-file .env up -d
#
# DB 스키마 원본:
#   infra/db/schema.sql — 최초 기동 시 자동 적용
# ============================================================
services:
  postgresql:
    image: postgres:16-alpine
    container_name: storyzip-postgresql-dev
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-storyzip}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storyzip_dev}
      POSTGRES_DB: ${DB_NAME:-storyzip}
    volumes:
      - storyzip-pgdata-dev:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-storyzip}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: storyzip-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
        --appendonly yes
        ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - storyzip-redis-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  storyzip-pgdata-dev:
  storyzip-redis-dev:
