version: "3.8"

services:
  postgresql:
    image: postgres:16-alpine
    container_name: storyzip-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storyzip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storyzip_dev}
      POSTGRES_DB: ${POSTGRES_DB:-storyzip}
    volumes:
      - storyzip-pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storyzip}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: storyzip-redis
    ports:
      - "6379:6379"
    volumes:
      - storyzip-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  storyzip-pgdata:
  storyzip-redis:
