# ============================================================
# 개발 프로필 (로컬 IDE 실행 + Docker DB/Redis)
#
# - DB: ddl-auto=update (엔티티 변경 시 자동 반영)
# - Swagger: 활성화
# - SQL 로깅: 활성화
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:storyzip}
    username: ${DB_USERNAME:storyzip}
    password: ${DB_PASSWORD:storyzip_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    "[com.storyzip]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.springframework.web.servlet.DispatcherServlet]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE
