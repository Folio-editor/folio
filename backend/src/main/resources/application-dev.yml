# ============================================================
# 개발 프로필 (로컬 IDE 실행 + Docker DB/Redis)
#
# - DB: ddl-auto=update (엔티티 변경 시 자동 반영)
# - Swagger: 활성화
# - SQL 로깅: 활성화
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:storyzip}
    username: ${DB_USERNAME:storyzip}
    password: ${DB_PASSWORD:storyzip_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    # 기본 — 노이즈 차단
    root: WARN
    "[com.storyzip]": INFO
    # AI 파이프라인 추적 — [AI-TRACE] 로그 보존 위해 INFO
    "[com.storyzip.sync.service.SyncService]": INFO
    "[com.storyzip.ai]": INFO
    # 외부 호출 로거
    "[external.ai]": INFO
    # Spring / Hibernate 노이즈 차단
    "[org.springframework.security]": WARN
    "[org.springframework.web.servlet.DispatcherServlet]": WARN
    "[org.springframework.web.client.RestTemplate]": WARN
    "[org.springframework.web.client.DefaultRestClient]": WARN
    "[org.springframework.orm]": WARN
    "[org.hibernate]": WARN
    "[org.hibernate.SQL]": WARN
    "[org.hibernate.orm.jdbc.bind]": WARN
    "[com.zaxxer.hikari]": WARN

# ────────────────────────────────────────────────────────────
# 환경별 설정 hardcode (도플러 슬림화 — 옵션 B)
# 시크릿 외 모든 값은 yaml에 박아 도플러 의존도 최소화.
# ────────────────────────────────────────────────────────────
google:
  oauth:
    web-redirect-uri: http://localhost:8080/api/v1/auth/google/web/callback

app:
  web:
    landing-url: http://localhost:5174
    editor-url: http://localhost:5173
    api-base-url: http://localhost:8080/api/v1
    cookie-secure: false
    cookie-domain: ""
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174

ai:
  client:
    # dev-start.sh가 AI 서버를 8001에 띄움 (line 48). 도플러 AI_SERVER_URL 있으면 우선.
    base-url: ${AI_SERVER_URL:http://127.0.0.1:8001}

# Plan C — dev 에서도 KEK 흐름 켬. SERVER_PEPPER 는 Doppler dev config 에서 주입.
folio:
  security:
    pepper:
      enabled: true
    # vault.enabled 는 application.yml 에서 true hardcode (dev/prod 동일 경로).
    # dev: backend 가 호스트에서 직접 실행 (gradlew bootRun) → docker 내부 도메인 'vault' 해석 불가.
    # compose 가 publish 한 host port (localhost:8200) 사용. prod 는 backend 도 컨테이너라 vault hostname 그대로.
    #
    # ★ Windows + WSL2 + Docker Desktop 환경에서 VS Code 의 Ports 자동 포워딩이
    # 127.0.0.1:8200 을 squat 하는 케이스가 잦다. JVM 은 'localhost' 를 IPv4 우선
    # resolve (java.net.preferIPv6Addresses=false 기본값) → VS Code listener 로 빨려가
    # 5초 read timeout → SocketTimeoutException → server-dek / decrypt 전부 500.
    # IPv6 loopback ([::1]) 직접 명시 — Docker 가 publish 한 [::]:8200 / wslrelay 의
    # [::1]:8200 으로 직행하므로 squat 회피. (2026-05-09 디버깅 결과)
    vault:
      url: http://[::1]:8200
