# ============================================================
# 개발 프로필 (로컬 IDE 실행 + Docker DB/Redis)
#
# - DB: ddl-auto=update (엔티티 변경 시 자동 반영)
# - Swagger: 활성화
# - SQL 로깅: 활성화
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:storyzip}
    username: ${DB_USERNAME:storyzip}
    password: ${DB_PASSWORD:storyzip_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    "[com.storyzip]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.springframework.web.servlet.DispatcherServlet]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE

# ────────────────────────────────────────────────────────────
# 환경별 설정 hardcode (도플러 슬림화 — 옵션 B)
# 시크릿 외 모든 값은 yaml에 박아 도플러 의존도 최소화.
# ────────────────────────────────────────────────────────────
google:
  oauth:
    web-redirect-uri: http://localhost:8080/api/v1/auth/google/web/callback

app:
  web:
    landing-url: http://localhost:5174
    editor-url: http://localhost:5173
    api-base-url: http://localhost:8080/api/v1
    cookie-secure: false
    cookie-domain: ""
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174

ai:
  client:
    # dev-start.sh가 AI 서버를 8001에 띄움 (line 48). 도플러 AI_SERVER_URL 있으면 우선.
    base-url: ${AI_SERVER_URL:http://localhost:8001}
