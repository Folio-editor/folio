# ============================================================
# 테스트 프로필 (CI / 통합 테스트)
#
# - DB: ddl-auto=create-drop (테스트 격리)
# - Swagger: 비활성화
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:storyzip_test}
    username: ${DB_USERNAME:storyzip}
    password: ${DB_PASSWORD:storyzip_test}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.storyzip: INFO
    org.hibernate.SQL: WARN
