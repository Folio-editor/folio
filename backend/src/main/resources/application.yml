spring:
  application:
    name: folio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

# JWT (HS256)
jwt:
  secret: ${JWT_SECRET}
  access-expiry: ${JWT_ACCESS_EXPIRY:1800}
  refresh-expiry: ${JWT_REFRESH_EXPIRY:1209600}
  audience: ${PS_JWT_AUDIENCE:powersync-dev}
  key-id: ${PS_JWT_KID:folio-dev}

# Google OAuth
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    desktop-client-id: ${GOOGLE_DESKTOP_CLIENT_ID:}
    desktop-client-secret: ${GOOGLE_DESKTOP_CLIENT_SECRET:}
    # 웹 OAuth 콜백 URL — Google Console "승인된 리디렉션 URI"와 일치해야 함
    web-redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/web/callback}

# 웹(브라우저) 호스팅 설정 — 랜딩/에디터/백엔드 3-도메인 OAuth 흐름과 RT 쿠키 운영
app:
  web:
    landing-url: ${WEB_LANDING_URL:http://localhost:5174}
    editor-url: ${WEB_FRONTEND_URL:http://localhost:5173}
    api-base-url: ${WEB_API_URL:http://localhost:8080/api/v1}
    cookie-domain: ${WEB_COOKIE_DOMAIN:}    # prod ".folio.com", dev 빈 값
    cookie-secure: ${WEB_COOKIE_SECURE:false}  # prod true, dev false
    allowed-origins: ${WEB_ALLOWED_ORIGINS:}   # 콤마 구분, 예: https://app.folio.com,https://folio.com

# AI 서버 (FastAPI)
ai:
  client:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    internal-api-key: ${AI_INTERNAL_API_KEY:dev-internal-key}
    connect-timeout: 3s
    read-timeout: 10s

# 토스페이먼츠
toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
    secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
    api-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    webhook-secret: ${TOSS_WEBHOOK_SECRET:}

# springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
