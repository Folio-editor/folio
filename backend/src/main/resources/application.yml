spring:
  application:
    name: folio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # prometheus 추가 — /actuator/prometheus 가 Micrometer Prometheus registry 메트릭 노출
        # (JVM, Tomcat HTTP, HikariCP, GC, Logback 등 자동)
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: folio-backend

# JWT (HS256)
jwt:
  secret: ${JWT_SECRET}
  access-expiry: ${JWT_ACCESS_EXPIRY:1800}
  refresh-expiry: ${JWT_REFRESH_EXPIRY:1209600}
  audience: ${PS_JWT_AUDIENCE:powersync-dev}
  key-id: ${PS_JWT_KID:folio-dev}

# Google OAuth (시크릿만 — web-redirect-uri는 환경별이라 application-{profile}.yml로 이동)
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    desktop-client-id: ${GOOGLE_DESKTOP_CLIENT_ID:}
    desktop-client-secret: ${GOOGLE_DESKTOP_CLIENT_SECRET:}

# AI 서버 (FastAPI) — base-url은 환경별이라 application-{profile}.yml로 이동
ai:
  client:
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
    connect-timeout: 3s
    read-timeout: 10s

# app.web.* 블록은 application-{dev,test,prod}.yml로 분리
# (랜딩/에디터/API URL, 쿠키 속성, CORS 모두 환경별로 다름)

# 토스페이먼츠
toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
    secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
    api-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    webhook-secret: ${TOSS_WEBHOOK_SECRET:}

# Google Analytics 4 Measurement Protocol
ga4:
  enabled: ${GA4_ENABLED:true}
  measurement-id: ${GA4_MEASUREMENT_ID:}
  api-secret: ${GA4_API_SECRET:}
  endpoint: ${GA4_ENDPOINT:https://www.google-analytics.com/mp/collect}
  debug-endpoint: ${GA4_DEBUG_ENDPOINT:https://www.google-analytics.com/debug/mp/collect}
  debug-mode: ${GA4_DEBUG_MODE:false}

# springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
