spring:
  application:
    name: storyzip-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    # 매핑되지 않은 요청에 대해 NoHandlerFoundException을 던지도록 설정
    # (GlobalExceptionHandler에서 404 응답으로 변환)
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

# JWT (HS256)
jwt:
  secret: ${JWT_SECRET}
  access-expiry: ${JWT_ACCESS_EXPIRY:1800}
  refresh-expiry: ${JWT_REFRESH_EXPIRY:1209600}

# Google OAuth
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    desktop-client-id: ${GOOGLE_DESKTOP_CLIENT_ID:}
    desktop-client-secret: ${GOOGLE_DESKTOP_CLIENT_SECRET:}

# 토스페이먼츠 (문서용 테스트 키를 기본값으로. 라이브 전환 시 환경변수로 덮어쓴다)
toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
    secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
    api-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    webhook-secret: ${TOSS_WEBHOOK_SECRET:}

# springdoc / Swagger 공통 (활성화 여부는 프로필별로 제어)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
