spring:
  application:
    name: storyzip-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    # 매핑되지 않은 요청에 대해 NoHandlerFoundException을 던지도록 설정
    # (GlobalExceptionHandler에서 404 응답으로 변환)
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

# JWT (HS256)
jwt:
  secret: ${JWT_SECRET}
  access-expiry: ${JWT_ACCESS_EXPIRY:1800}
  refresh-expiry: ${JWT_REFRESH_EXPIRY:1209600}

# Google OAuth
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    desktop-client-id: ${GOOGLE_DESKTOP_CLIENT_ID:}
    desktop-client-secret: ${GOOGLE_DESKTOP_CLIENT_SECRET:}

# AI 서버 (FastAPI)
ai:
  client:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    internal-api-key: ${AI_INTERNAL_API_KEY:dev-internal-key}
    connect-timeout: 3s
    read-timeout: 10s

# springdoc / Swagger 공통 (활성화 여부는 프로필별로 제어)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
