# ============================================================
# 운영 프로필 (배포 환경)
#
# - DB: ddl-auto=validate (운영 스키마는 마이그레이션 도구로 관리, 검증만 수행)
# - Swagger: 비활성화 (보안)
# - SQL 로깅: 끔
# - 모든 시크릿은 환경변수 필수 (default 없음)
# ============================================================
server:
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:50}
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# 로깅 설정은 logback-spring.xml 에서 관리 (prod 프로필은 JSON 포맷)

# ────────────────────────────────────────────────────────────
# 메트릭 — Prometheus 히스토그램 활성화 (운영 한정)
# Spring Boot 기본은 _count/_sum/_max 만 노출하고 _bucket 미노출 →
# histogram_quantile() 로 p50/p95/p99 계산 불가.
# percentiles-histogram=true 로 Prometheus native bucket 자동 생성.
# (uri × method × le bucket 으로 시리즈 ~10× 증가하나 prod 트래픽 수준에선 무시 가능)
# ────────────────────────────────────────────────────────────
management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

# ────────────────────────────────────────────────────────────
# 운영 도메인 hardcode (도플러 슬림화 — 옵션 B)
# 운영은 https://folio-editor.co.kr 단일 도메인 + path 라우팅 (nginx.conf 검증)
#   /          → 랜딩
#   /editor    → 웹 에디터
#   /api/v1/*  → 백엔드
#   /sync/*    → PowerSync
# ────────────────────────────────────────────────────────────
google:
  oauth:
    web-redirect-uri: https://folio-editor.co.kr/api/v1/auth/google/web/callback

app:
  web:
    landing-url: https://folio-editor.co.kr
    editor-url: https://folio-editor.co.kr/editor
    api-base-url: https://folio-editor.co.kr/api/v1
    cookie-secure: true
    cookie-domain: ""    # 단일 도메인이라 host-only로 충분
    allowed-origins:
      - https://folio-editor.co.kr

# AI_SERVER_URL은 docker-compose blue/green에서 컨테이너명 종속(http://fastapi-{blue,green}:8000)
# 환경변수 유지 (도플러 아니라 compose 직접 주입)
ai:
  client:
    base-url: ${AI_SERVER_URL}
    # prod는 default 없음 — 도플러 누락 시 즉시 startup 실패 (fail-fast)
    internal-api-key: ${INTERNAL_API_KEY}
