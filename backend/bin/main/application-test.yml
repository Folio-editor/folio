# ============================================================
# 테스트 프로필 (CI / 통합 테스트)
#
# - DB: ddl-auto=create-drop (테스트 격리)
# - Swagger: 비활성화
# ============================================================
# JWT_SECRET 환경변수 미주입 시 unit/통합 테스트가 startup에서 실패하지 않도록
# 32바이트 이상 더미 시크릿을 fallback으로 둔다 (실제 prod에서는 Doppler 값으로 덮어씀).
jwt:
  secret: ${JWT_SECRET:test-secret-only-for-unit-and-integration-tests-32chars}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:storyzip_test}
    username: ${DB_USERNAME:storyzip}
    password: ${DB_PASSWORD:storyzip_test}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.storyzip: INFO
    org.hibernate.SQL: WARN

# ────────────────────────────────────────────────────────────
# 환경별 설정 hardcode (도플러 슬림화 — 옵션 B)
# test는 web OAuth 통합 테스트 안 함 — app.web 블록은 빈 값 default 유지
# ────────────────────────────────────────────────────────────
google:
  oauth:
    web-redirect-uri: http://localhost:8080/api/v1/auth/google/web/callback

app:
  web:
    landing-url: http://localhost:5174
    editor-url: http://localhost:5173
    api-base-url: http://localhost:8080/api/v1
    cookie-secure: false
    cookie-domain: ""
    allowed-origins:
      - http://localhost:5173

ai:
  client:
    base-url: http://fastapi-test:8000

# Vault 는 단위·통합 테스트에서 띄우지 않음 → 비활성. testcontainers 기반 vault
# 통합 테스트는 별도 @ActiveProfiles 또는 @TestPropertySource 로 enabled=true override.
folio:
  security:
    vault:
      enabled: false
