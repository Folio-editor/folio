spring:
  application:
    name: folio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # prometheus 추가 — /actuator/prometheus 가 Micrometer Prometheus registry 메트릭 노출
        # (JVM, Tomcat HTTP, HikariCP, GC, Logback 등 자동)
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: folio-backend

# JWT (HS256)
jwt:
  secret: ${JWT_SECRET}
  access-expiry: ${JWT_ACCESS_EXPIRY:1800}
  refresh-expiry: ${JWT_REFRESH_EXPIRY:1209600}
  audience: ${PS_JWT_AUDIENCE:powersync-dev}
  key-id: ${PS_JWT_KID:folio-dev}

# Google OAuth (시크릿만 — web-redirect-uri는 환경별이라 application-{profile}.yml로 이동)
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    desktop-client-id: ${GOOGLE_DESKTOP_CLIENT_ID:}
    desktop-client-secret: ${GOOGLE_DESKTOP_CLIENT_SECRET:}

# AI 서버 (FastAPI) — base-url은 환경별이라 application-{profile}.yml로 이동
ai:
  client:
    # INTERNAL_API_KEY 미주입 시 부팅 실패 (Phase 2 R-D 보호 장치).
    # 기본값을 두면 silent 401 로 모든 AI 호출이 죽는데도 운영자가 모름.
    internal-api-key: ${INTERNAL_API_KEY}
    connect-timeout: 3s
    read-timeout: 10s

# app.web.* 블록은 application-{dev,test,prod}.yml로 분리
# (랜딩/에디터/API URL, 쿠키 속성, CORS 모두 환경별로 다름)

# Folio 보안 (Plan C — 결정 6/15/16)
# server_pepper 는 Doppler 의 SERVER_PEPPER 환경변수 (32B base64) 로 직접 주입.
# 이전엔 AWS Secrets Manager 사용했으나 EC2 외부 차단 환경에서 사용 불가 → 폐기.
folio:
  security:
    pepper:
      enabled: ${FOLIO_PEPPER_ENABLED:false}
      master-pepper-base64: ${SERVER_PEPPER:}
      version: ${SERVER_PEPPER_VERSION:v1}
    # Vault Transit envelope encryption (curious-wiggling-thacker plan V-2).
    # dev/prod 모두 doppler 가 동일하게 VAULT_TOKEN 주입 → 환경별 분기 불필요.
    # test profile 만 application-test.yml 에서 enabled=false 로 override (vault 컨테이너 미기동).
    # **VAULT_TOKEN 만 시크릿 — Doppler 에서 주입.** 나머지는 환경 무관 고정값.
    vault:
      enabled: true
      url: http://vault:8200   # 컴포즈 내부 도메인 — 모든 환경 동일
      token: ${VAULT_TOKEN:}   # 유일한 시크릿 (vault-init.sh 출력 → Doppler 등록)
      transit-key: folio-work-dek
      cache-ttl-seconds: 300
      connect-timeout-ms: 2000
      read-timeout-ms: 5000

# PortOne (포트원) V2
# storeId/channelKey는 클라이언트 전용 — 서버 yml에는 두지 않는다.
# 백엔드는 apiSecret만 필요 (REST 호출용 Authorization 헤더).
portone:
  api-secret: ${PORTONE_API_SECRET:}
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}

# Google Analytics 4 Measurement Protocol
ga4:
  enabled: ${GA4_ENABLED:true}
  measurement-id: ${GA4_MEASUREMENT_ID:}
  api-secret: ${GA4_API_SECRET:}
  endpoint: ${GA4_ENDPOINT:https://www.google-analytics.com/mp/collect}
  debug-endpoint: ${GA4_DEBUG_ENDPOINT:https://www.google-analytics.com/debug/mp/collect}
  debug-mode: ${GA4_DEBUG_MODE:false}

# springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
